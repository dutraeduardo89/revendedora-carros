<h2>Cadastros Auxiliares</h2>
<div *ngIf="msg" class="alert alert-success">{{ msg }}</div>

<div class="row">
  <!-- MARCA -->
  <div class="col-md-4">
    <div class="card p-3 mb-3">
      <h5>Nova Marca</h5>
      <input type="text" class="form-control mb-2" [(ngModel)]="novaMarca.nome" placeholder="Nome da Marca">
      <button class="btn btn-primary btn-sm" (click)="salvarMarca()">Salvar Marca</button>
    </div>
  </div>

  <!-- MODELO -->
  <div class="col-md-4">
    <div class="card p-3 mb-3">
      <h5>Novo Modelo</h5>
      <input type="text" class="form-control mb-2" [(ngModel)]="novoModelo.nome" placeholder="Nome do Modelo">
      <select class="form-select mb-2" [(ngModel)]="novoModelo.id_marca">
        <option [ngValue]="null">Selecione a Marca</option>
        <option *ngFor="let m of marcas" [value]="m.id_marca">{{ m.nome }}</option>
      </select>
      <button class="btn btn-primary btn-sm" (click)="salvarModelo()">Salvar Modelo</button>
    </div>
  </div>

  <!-- ACESSÓRIO -->
  <div class="col-md-4">
    <div class="card p-3 mb-3">
      <h5>Novo Acessório</h5>
      <input type="text" class="form-control mb-2" [(ngModel)]="novoAcessorio.nome" placeholder="Nome do Acessório">
      <button class="btn btn-primary btn-sm" (click)="salvarAcessorio()">Salvar Acessório</button>
    </div>
  </div>
</div>
