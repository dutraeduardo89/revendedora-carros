<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4 fw-bold">Criar Nova Conta</h3>
        
        <div *ngIf="msg" class="alert {{ tipoMsg }} py-2">{{ msg }}</div>

        <div class="mb-3">
          <label class="form-label fw-medium">Nome de Usuário</label>
          <input type="text" class="form-control" [(ngModel)]="dados.login" placeholder="Ex: joao123">
        </div>
        <div class="mb-4">
          <label class="form-label fw-medium">Senha</label>
          <input type="password" class="form-control" [(ngModel)]="dados.senha" placeholder="Sua senha secreta">
        </div>
        
        <button class="btn btn-success w-100 mb-3" (click)="registrar()">Cadastrar</button>
        
        <div class="text-center">
          <a routerLink="/" class="text-decoration-none">Já tenho conta. Fazer Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
