<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4 fw-bold">Login do Sistema</h3>
        
        <div *ngIf="erro" class="alert alert-danger py-2">{{ erro }}</div>

        <div class="mb-3">
          <label class="form-label fw-medium">Usuário</label>
          <input type="text" class="form-control" [(ngModel)]="credenciais.login" placeholder="admin">
        </div>
        <div class="mb-4">
          <label class="form-label fw-medium">Senha</label>
          <input type="password" class="form-control" [(ngModel)]="credenciais.senha" placeholder="123">
        </div>
        
        <button class="btn btn-primary w-100 mb-3" (click)="entrar()">Entrar</button>
        
        <div class="text-center">
          <a routerLink="/register" class="text-decoration-none text-muted">Não tem conta? Cadastre-se</a>
        </div>
      </div>
    </div>
  </div>
</div>
