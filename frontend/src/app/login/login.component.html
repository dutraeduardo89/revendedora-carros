<div class="login-tela">
  <div class="card border-0 login-cartao">
    <div class="login-marca">
      <div class="login-icone" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
      </div>
      <div>
        <div class="login-nome">Revendedora de Carros</div>
        <div class="text-muted small">Gestão interna do estoque</div>
      </div>
    </div>
    <h1 class="h3 mb-1 fw-bold">Entrar</h1>
    <p class="text-muted mb-4">Use o usuário da sua conta para abrir o inventário.</p>
    <div *ngIf="aviso" class="alert alert-success" role="status">{{ aviso }}</div>
    <div *ngIf="erro" class="alert alert-danger" role="alert">{{ erro }}</div>
    <form (ngSubmit)="entrar()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="login">Usuário</label>
        <input id="login" type="text" class="form-control" name="login" [(ngModel)]="credenciais.login" autocomplete="username" [class.is-invalid]="erros['login']">
        <div class="invalid-feedback">{{ erros['login'] }}</div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="senha">Senha</label>
        <input id="senha" type="password" class="form-control" name="senha" [(ngModel)]="credenciais.senha" autocomplete="current-password" [class.is-invalid]="erros['senha']">
        <div class="invalid-feedback">{{ erros['senha'] }}</div>
      </div>
      <button class="btn btn-primary w-100 mb-3" type="submit" [disabled]="enviando">{{ enviando ? 'Entrando...' : 'Entrar' }}</button>
    </form>
    <div class="text-center">
      <a routerLink="/register">Não tem conta? Cadastre-se</a>
    </div>
  </div>
</div>
